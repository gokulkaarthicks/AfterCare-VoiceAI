# Alembic configuration: the revision chain lives in shared/database/migrations.
# Run from the repository root: `alembic upgrade head`

[alembic]
script_location = %(here)s/app/shared/database/migrations
prepend_sys_path = .

# SQL is read from app.shared.core.config (DATABASE_URL); this value is unused but
# required by Alembic's config parser.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration drives the console verbosity of migration runs.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
